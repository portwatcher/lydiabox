<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LydiaBox</title>
<style>
  :root { color-scheme: dark; --bg: #0d1014; --fg: #e6e8eb; --muted: #9aa3ad; --accent: #7cc4ff; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: .5rem 0; }
  code { color: var(--accent); }
  #status { margin-top: 1.5rem; font-family: ui-monospace, monospace; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>LydiaBox is running</h1>
  <p>This build has no web interface. Build it with <code>make web-build</code>, then <code>make build</code>.</p>
  <p>The REST API is at <code>/api/v1</code>. WebDAV is at <code>/webdav/</code>.</p>
  <div id="status" aria-live="polite"></div>
</main>
<script>
  fetch("/api/v1/health").then(function (r) { return r.json(); }).then(function (b) {
    document.getElementById("status").textContent = "API health: " + b.status;
  }).catch(function () {
    document.getElementById("status").textContent = "API health: unreachable";
  });
</script>
</body>
</html>
