; LydiaBox guest process supervisor (started by /usr/local/sbin/lydiabox-init).
; Environment set by the VMM driver (LYDIABOX_GUEST_LISTEN, LYDIABOX_HOST_ADDR,
; LYDIABOX_GATEWAY_ADDR, LYDIABOX_WEBRTC_UDP_PORT, LYDIABOX_CHROME_FLAGS) is
; inherited by every program.
;
; The desktop session and the guest daemon (and so the desktop terminals
; and the programs that the Desktop page starts) also get ~/.local/bin at
; the end of PATH, where user-level installs put their commands, and
; CLI_HUB_NO_ANALYTICS=1 (no usage events from cli-hub). The PTYs get
; both from lydiabox-guest (internal/guest/ptymanager).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/dbus.log
redirect_stderr=true

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1920x1080x24 -nolisten tcp -dpi 96 +extension XTEST
user=agent
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
redirect_stderr=true

[program:xfce]
; dbus-run-session keeps the session bus for the life of startxfce4.
; dbus-launch --exit-with-session stops the bus when its stdin closes, and
; supervisord gives programs no stdin, so xfconfd, xfwm4, and the panel
; did not start ("Unable to contact settings server").
command=/usr/bin/dbus-run-session -- /usr/bin/startxfce4
user=agent
directory=/home/agent
environment=DISPLAY=":0",HOME="/home/agent",USER="agent",LOGNAME="agent",SHELL="/bin/bash",XDG_RUNTIME_DIR="/run/user/1000",PATH="%(ENV_PATH)s:/home/agent/.local/bin",CLI_HUB_NO_ANALYTICS="1"
priority=30
startsecs=5
autorestart=true
stdout_logfile=/var/log/supervisor/xfce.log
redirect_stderr=true

[program:lydiabox-guest]
command=/usr/local/bin/lydiabox-guest serve
user=agent
directory=/home/agent
environment=DISPLAY=":0",HOME="/home/agent",USER="agent",LOGNAME="agent",SHELL="/bin/bash",XDG_RUNTIME_DIR="/run/user/1000",PATH="%(ENV_PATH)s:/home/agent/.local/bin",CLI_HUB_NO_ANALYTICS="1"
priority=40
startsecs=2
autorestart=true
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
