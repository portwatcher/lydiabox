; LydiaBox process supervisor in the InstaBox image, started by
; /usr/local/sbin/lydiabox-instabox-entry. The same programs as
; deploy/rootfs/supervisord.conf, with the agent home (/home/agent) a
; link to the persistent disk (/data/lydiabox/home), the display from
; LYDIABOX_DISPLAY, no system D-Bus program (the machine's systemd or the
; entry point runs it), Xfce on a session bus of its own, and the guest
; daemon behind a wrapper that reads the driver's settings file.
;
; The programs run as UID 1000 by number: on InstaBox that user has the
; account's name, not "agent" (an import keeps the machine's user
; database). The entry point sets LYDIABOX_GUEST_USER to the name of UID
; 1000, LYDIABOX_GUEST_HOME to /home/agent, and the file roots
; LYDIABOX_GUEST_HOME_ROOT and LYDIABOX_GUEST_WORKSPACE_ROOT; every program
; inherits them. lydiabox-guest gives its PTYs only a defined part of its
; environment (ptymanager.Inherited).
;
; Xfce and the guest daemon also get the agent home's .local/bin at the
; end of PATH (user-level installs) and CLI_HUB_NO_ANALYTICS=1 (no usage
; events from cli-hub), as in deploy/rootfs/supervisord.conf.
;
; The desktop session and the guest daemon start in /home/agent with
; PWD=/home/agent. supervisord changes to the directory, but the kernel
; keeps only the link's target (/data/lydiabox/home), and without PWD the
; shells set PWD to that target: a terminal from the panel or the menu
; showed /data/lydiabox/home, not "~". (The guest daemon starts the
; Desktop page's programs in $HOME with a matching PWD itself.)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_LYDIABOX_DISPLAY)s -screen 0 1920x1080x24 -nolisten tcp -dpi 96 +extension XTEST
user=1000
directory=/tmp
environment=HOME="%(ENV_LYDIABOX_GUEST_HOME)s",USER="%(ENV_LYDIABOX_GUEST_USER)s",LOGNAME="%(ENV_LYDIABOX_GUEST_USER)s"
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
redirect_stderr=true

[program:xfce]
; The wrapper runs startxfce4 on a session bus of its own, so that the
; services that the bus starts (xfconfd) get HOME=/home/agent. A stop
; signals the whole process group (the session and its bus).
command=/usr/local/bin/lydiabox-instabox-xfce
stopasgroup=true
killasgroup=true
user=1000
directory=%(ENV_LYDIABOX_GUEST_HOME)s
environment=DISPLAY="%(ENV_LYDIABOX_DISPLAY)s",HOME="%(ENV_LYDIABOX_GUEST_HOME)s",PWD="%(ENV_LYDIABOX_GUEST_HOME)s",USER="%(ENV_LYDIABOX_GUEST_USER)s",LOGNAME="%(ENV_LYDIABOX_GUEST_USER)s",SHELL="/bin/bash",XDG_RUNTIME_DIR="/run/user/1000",PATH="%(ENV_PATH)s:%(ENV_LYDIABOX_GUEST_HOME)s/.local/bin",CLI_HUB_NO_ANALYTICS="1"
priority=30
startsecs=5
startretries=10
autorestart=true
stdout_logfile=/var/log/supervisor/xfce.log
redirect_stderr=true

[program:lydiabox-guest]
; The programs that the guest starts on the desktop (the Desktop page's
; Terminal, Chrome, and Blender) use the Xfce session's own bus
; (lydiabox-instabox-xfce). Without the address they used the user
; manager's bus, whose xfconfd has HOME=/data/home and wrote into
; InstaBox's home.
command=/usr/local/bin/lydiabox-instabox-guest
user=1000
directory=%(ENV_LYDIABOX_GUEST_HOME)s
environment=DISPLAY="%(ENV_LYDIABOX_DISPLAY)s",HOME="%(ENV_LYDIABOX_GUEST_HOME)s",PWD="%(ENV_LYDIABOX_GUEST_HOME)s",USER="%(ENV_LYDIABOX_GUEST_USER)s",LOGNAME="%(ENV_LYDIABOX_GUEST_USER)s",SHELL="/bin/bash",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/lydiabox-session-bus",PATH="%(ENV_PATH)s:%(ENV_LYDIABOX_GUEST_HOME)s/.local/bin",CLI_HUB_NO_ANALYTICS="1"
priority=40
startsecs=2
startretries=10
autorestart=true
stopsignal=TERM
stopwaitsecs=15
; A file, not /dev/stdout: under systemd the standard output is a journal
; socket, which supervisord cannot open (ENXIO).
stdout_logfile=/var/log/supervisor/lydiabox-guest.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
